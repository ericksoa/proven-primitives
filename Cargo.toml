[package]
name = "proven-primitives"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
description = "Byte-processing primitives with machine-checked correctness contracts"
license = "Apache-2.0"
publish = false

[dependencies]
vstd = "=0.0.0-2026-10-18-0147"

[dev-dependencies]
base64_ref = { package = "base64", version = "=0.23.1" }
lz4_ref = { package = "lz4_flex", version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
lz4_vulnerable = { package = "lz4_flex", git = "https://github.com/PSeitz/lz4_flex", rev = "975bfa7ac9583da879b5d7578b423232d84f69fe", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)", "cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[[bench]]
name = "primitives"
harness = false
